<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MedTriage — Connect to server</title>
  <style>
    :root {
      --bg: #f8f5ee;
      --card: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e2d6;
      --brand: #0d9488;
      --brand-dark: #0f766e;
      --brand-soft: #f0fdfa;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
      padding: 24px 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(28, 25, 23, 0.06);
    }
    h1 { margin: 0 0 4px; font-size: 22px; }
    h1 span { color: var(--brand); }
    .lead { margin: 0 0 24px; color: var(--muted); }
    h2 {
      margin: 24px 0 8px;
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .notice {
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--danger-soft);
      color: var(--danger);
      margin-bottom: 16px;
      font-size: 14px;
    }
    .servers { display: grid; gap: 8px; }
    .server {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--card);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .server:hover, .server:focus-visible { border-color: var(--brand); background: var(--brand-soft); outline: none; }
    .server strong { display: block; }
    .server small { color: var(--muted); }
    .empty { color: var(--muted); font-size: 14px; margin: 0; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
    }
    input:focus { outline: 2px solid var(--brand); outline-offset: -1px; border-color: transparent; }
    button.primary, button.secondary {
      padding: 10px 16px;
      border-radius: 10px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--brand);
    }
    button.primary { background: var(--brand); color: #fff; }
    button.primary:hover { background: var(--brand-dark); }
    button.secondary { background: var(--card); color: var(--brand); margin-top: 12px; }
    button:disabled { opacity: 0.6; cursor: progress; }
    .hint { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
    .error { color: var(--danger); font-size: 14px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>MedTriage <span>AI</span></h1>
    <p class="lead">Connect to your facility's MedTriage Server.</p>

    <div id="unreachable" class="notice" hidden></div>

    <h2>Servers on this network</h2>
    <div id="servers" class="servers" aria-live="polite"></div>
    <button id="search" class="secondary" type="button">Search again</button>

    <h2>Or enter the server address</h2>
    <form id="manual">
      <input id="address" type="text" placeholder="e.g. 192.168.1.20" autocomplete="off" aria-label="Server address" />
      <button class="primary" type="submit">Connect</button>
    </form>
    <p class="hint">The address is shown in the MedTriage Server window on the facility's server computer.</p>
    <p id="error" class="error" role="alert" hidden></p>
  </main>

  <script>
    const serversEl = document.getElementById('servers');
    const errorEl = document.getElementById('error');
    const searchBtn = document.getElementById('search');

    function showError(message) {
      errorEl.textContent = message;
      errorEl.hidden = !message;
    }

    function renderServers(servers) {
      serversEl.replaceChildren();
      if (!servers.length) {
        const p = document.createElement('p');
        p.className = 'empty';
        p.textContent = 'No MedTriage Server found. Check that the server computer is on and connected to the same network.';
        serversEl.append(p);
        return;
      }
      for (const server of servers) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'server';
        const label = document.createElement('span');
        const name = document.createElement('strong');
        name.textContent = server.name;
        const url = document.createElement('small');
        url.textContent = server.url;
        label.append(name, url);
        const arrow = document.createElement('span');
        arrow.textContent = 'Connect →';
        arrow.style.color = 'var(--brand)';
        button.append(label, arrow);
        button.addEventListener('click', () => connect(server.url));
        serversEl.append(button);
      }
    }

    async function connect(address) {
      showError('');
      const buttons = document.querySelectorAll('button');
      buttons.forEach((b) => (b.disabled = true));
      try {
        const res = await fetch('/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ address }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not connect.');
        window.location.href = data.url;
      } catch (err) {
        showError(err.message);
        buttons.forEach((b) => (b.disabled = false));
      }
    }

    searchBtn.addEventListener('click', async () => {
      showError('');
      searchBtn.disabled = true;
      searchBtn.textContent = 'Searching…';
      try {
        const res = await fetch('/search', { method: 'POST' });
        renderServers((await res.json()).servers);
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Search again';
      }
    });

    document.getElementById('manual').addEventListener('submit', (e) => {
      e.preventDefault();
      const address = document.getElementById('address').value.trim();
      if (!address) return showError('Enter the server address, e.g. 192.168.1.20');
      connect(address);
    });

    fetch('/state')
      .then((res) => res.json())
      .then((state) => {
        if (state.unreachableServer) {
          const notice = document.getElementById('unreachable');
          notice.textContent = `Couldn't reach the last server (${state.unreachableServer}). It may be switched off, or this computer is on a different network.`;
          notice.hidden = false;
        }
        renderServers(state.servers);
      });
  </script>
</body>
</html>
